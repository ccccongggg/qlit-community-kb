<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程表练习 · 社群知识库</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6f2;color:#183c30;font:16px/1.8 system-ui,'Microsoft YaHei',sans-serif}main{max-width:720px;margin:8vh auto;padding:24px}h1{font-size:36px;line-height:1.3}label{display:block}select{width:100%;padding:12px;border:1px solid #8da99c;border-radius:8px;background:white;font:inherit;margin:12px 0}article{padding:20px 0;border-bottom:1px solid #c6d6ce}h2{font-size:20px;margin:0}p{margin:8px 0}a{color:#086348}:focus-visible{outline:3px solid #087052;outline-offset:4px}.note{font-size:14px;color:#486858}</style></head><body><main><a href="/kb/">← 返回知识库</a><p class="note">可运行的 HTML / JavaScript 练习</p><h1>今天上什么课？</h1><p>以下是演示数据，你可以保存网页，修改源码中的课程。</p><label for="day">选择星期</label><select id="day"><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option></select><section id="courses" aria-live="polite"></section><p class="note">无教务系统连接，不保存或上传个人数据。</p></main><script>
'use strict';
const timetable={1:[{name:'程序设计基础',time:'08:00–09:40',room:'示例教室 A101'},{name:'高等数学',time:'10:00–11:40',room:'示例教室 A203'}],2:[{name:'大学英语',time:'14:00–15:40',room:'示例教室 B102'}],3:[{name:'工程实践',time:'08:00–09:40',room:'示例实验室'}],4:[],5:[{name:'设计与表达',time:'14:00–15:40',room:'示例教室 C201'}],6:[],0:[]};
const select=document.querySelector('#day'),container=document.querySelector('#courses');
function render(){container.replaceChildren();const courses=timetable[select.value]||[];if(!courses.length){const p=document.createElement('p');p.textContent='这一天没有示例课程，可以安排自习或休息。';container.append(p);}courses.forEach(course=>{const article=document.createElement('article'),title=document.createElement('h2'),detail=document.createElement('p');title.textContent=course.name;detail.textContent=course.time+' · '+course.room;article.append(title,detail);container.append(article);});}
select.value=String(new Date().getDay());select.addEventListener('change',render);render();
try { const sc=new URLSearchParams(location.search).get('sharecode')||sessionStorage.getItem('kb-sc');if(sc)document.querySelector('a').href+='?sharecode='+encodeURIComponent(sc); } catch (error) {}
</script></body></html>
